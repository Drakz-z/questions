    let currentFilter = "all";
    let activeQuestions = [...questionsData];
    let score = 0;
    let answeredCount = 0;

    function renderQuiz() {
      const container = document.getElementById("quizContainer");
      container.innerHTML = "";
      score = 0;
      answeredCount = 0;
      updateScore();

      activeQuestions.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "q-card";

        const meta = document.createElement("div");
        meta.className = "q-meta";

        let tagClass = "tag-l3";
        let tagLabel = "Lecture 3: Politics & History";
        if (item.lec === "L4") {
          tagClass = "tag-l4";
          tagLabel = "Lecture 4: Values & Heritage";
        } else if (item.lec === "blooket") {
          tagClass = "tag-blooket";
          tagLabel = "Blooket Practice";
        }

        meta.innerHTML = `
          <span class="q-tag ${tagClass}">${tagLabel}</span>
          <span>Question ${index + 1} of ${activeQuestions.length}</span>
        `;

        const qText = document.createElement("div");
        qText.className = "q-text";
        qText.textContent = item.q;

        const optsDiv = document.createElement("div");
        optsDiv.className = "options";

        const fb = document.createElement("div");
        fb.className = "feedback";
        fb.innerHTML = `<strong>Explanation:</strong> ${item.exp}`;

        const letters = ["a", "b", "c", "d"];
        item.opts.forEach((optText, optIndex) => {
          const btn = document.createElement("button");
          btn.className = "opt-btn";
          btn.textContent = `${letters[optIndex] || ''}. ${optText}`;
          btn.onclick = () => selectAnswer(btn, optIndex, item.ans, optsDiv, fb);
          optsDiv.appendChild(btn);
        });

        card.appendChild(meta);
        card.appendChild(qText);
        card.appendChild(optsDiv);
        card.appendChild(fb);
        container.appendChild(card);
      });
    }

    function selectAnswer(clickedBtn, chosenIdx, correctIdx, optsDiv, fb) {
      const allBtns = optsDiv.querySelectorAll(".opt-btn");
      allBtns.forEach((b, i) => {
        b.disabled = true;
        if (i === correctIdx) b.classList.add("correct");
      });

      if (chosenIdx === correctIdx) {
        score++;
      } else {
        clickedBtn.classList.add("wrong");
      }
      answeredCount++;
      fb.style.display = "block";
      updateScore();
    }

    function updateScore() {
      const pct = answeredCount === 0 ? 0 : Math.round((score / answeredCount) * 100);
      document.getElementById("scoreDisplay").textContent = `Score: ${score} / ${answeredCount} (${pct}%)`;
    }

    function filterQuiz(filterType, btnEl) {
      currentFilter = filterType;
      document.querySelectorAll(".ctrl-btn").forEach(b => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");

      const subHeader = document.getElementById("quizSub");
      if (filterType === "all") {
        activeQuestions = [...questionsData];
        subHeader.textContent = "All Questions (62 Total)";
      } else if (filterType === "L3") {
        activeQuestions = questionsData.filter(q => q.lec === "L3");
        subHeader.textContent = "Lecture 3: International Politics & History (20 Questions)";
      } else if (filterType === "L4") {
        activeQuestions = questionsData.filter(q => q.lec === "L4");
        subHeader.textContent = "Lecture 4: Core Values & Heritage (20 Questions)";
      } else if (filterType === "blooket") {
        activeQuestions = questionsData.filter(q => q.lec === "blooket");
        subHeader.textContent = "Blooket Practice Questions (22 Questions)";
      }
      renderQuiz();
    }

    function shuffleQuiz() {
      for (let i = activeQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [activeQuestions[i], activeQuestions[j]] = [activeQuestions[j], activeQuestions[i]];
      }
      renderQuiz();
    }

    function resetQuiz() {
      if (currentFilter === "all") {
        activeQuestions = [...questionsData];
      } else {
        activeQuestions = questionsData.filter(q => q.lec === currentFilter);
      }
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderQuiz();
  </script>
